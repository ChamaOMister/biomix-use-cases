name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same Postgres major version as the dev container. The database tests create and drop their
    # own schemas, and fail rather than skip when CI has no DATABASE_URL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: biomix
          POSTGRES_PASSWORD: biomix
          POSTGRES_DB: biomix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biomix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://biomix:biomix@localhost:5432/biomix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      # lint → typecheck → behavior tests (npm test) → production build
      - run: npm run check
      # The downloadable report snapshot, built from the seed (decision 002, item 7). Kept with the
      # run for review; the release job below publishes it for version tags.
      - run: npm run snapshot:build
      - uses: actions/upload-artifact@v4
        with:
          name: report-snapshot
          path: data/generated/snapshot/biomix-report-snapshot.html
          if-no-files-found: error
          retention-days: 30

  # A pushed version tag (for example v1.0.0) publishes the snapshot as a GitHub Release asset, so
  # the README's "latest release" link serves it. Runs only after every check above has passed.
  release-snapshot:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: report-snapshot
      - name: Attach the snapshot to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          file=biomix-report-snapshot.html
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$file" --clobber
          else
            gh release create "$TAG" "$file" --verify-tag --title "$TAG" \
              --notes "Report snapshot: synthetic, fictional data from the seeded generator. Download $file and open it in a browser; it works offline."
          fi
